name: Build docker image and push

on:
  push:
    branches: [dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Checkout repository
          uses: actions/checkout@v4

        - id: string
          name: Lower the GitHub Username
          uses: ASzc/change-string-case-action@v6
          with:
            string: ${{ github.actor }}

        - name: Build Image
          run: docker build . --tag ghcr.io/${{ steps.string.outputs.lowercase }}/lox:latest

        - name: Push Image
          run: docker push ghcr.io/${{ steps.string.outputs.lowercase }}/lox:latest
